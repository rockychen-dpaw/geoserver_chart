{{- if and (hasKey $.Values "geoserver") (hasKey $.Values.geoserver "imagepull") }}
{{- $data := dict "auths" (dict ($.Values.geoserver.imagepull.domain | default "ghcr.io")  (dict "username" ($.Values.geoserver.imagepull.username ) "password" ($.Values.gwcManage.geoserver.password ) )) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-geoserver-secret-imagepull
  namespace: {{ $.Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ toJson $data | b64enc }}
{{- end }}
